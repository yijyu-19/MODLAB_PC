# 我的世界 游戏配置。选择本游戏后由软件读取。
# 本游戏不做 MOD 管理，只在「设置 → 游戏设置」里提供 PCL 启动器工具。
# 半成品：仅工具入口，不是完整的 MOD 管理器。

[Game]
id = minecraft

# PCL 启动器（Plain Craft Launcher 2.exe）的位置。「启动游戏」会直接运行它。
# 模板留空，请在设置中选择，不要写入本机绝对路径。
exe =

launcher =

# 不管理 MOD：关闭 MOD 列表、角色列表与预览。
supports_mods = false
supports_characters = false
supports_preview = false
supports_mod_toggle = false
character_preview = false
install_ask_mod_type = false

# 半成品标签。
tool_only = true
status = tool_only
