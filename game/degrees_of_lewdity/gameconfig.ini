# 欲都孤儿（Degrees of Lewdity）游戏配置。选择本游戏后由软件读取。
# 本游戏在 MODLAB 中仅按移动端 / ADB 流程适配：在手机或模拟器上启动游戏，没有角色列表、预览与导出。
# 半成品：不是完整的 PC MOD 管理器。
[Game]
id = degrees_of_lewdity

# MOD 根目录。相对路径以软件根目录为基准。软件在此管理已安装的 .mod.zip（不解压）。
mod_dir = game\degrees_of_lewdity\mods

# 欲都孤儿：关闭角色列表/更新；关闭右侧预览；安装时保留 zip 不解压；不负责 MOD 开关（入库即视为开启）。
supports_characters = false
supports_preview = false
install_keep_zip = true
supports_mod_toggle = false
install_ask_mod_type = false
install_default_mod_type = jml
# 入库后立刻 ADB 推送到 adb_mod_dir（失败则回滚本地入库）。
install_requires_adb = true

# ADB 推送到设备上的默认目录（旁加载仍需在游戏内选文件）。
adb_mod_dir = /sdcard/Download/DoL_Mods

# 半成品标签：仅工具 / 送包，不是完整 MOD 管理器。
tool_only = true
status = tool_only
