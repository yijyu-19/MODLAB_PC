# 明日方舟游戏配置。选择本游戏后由软件读取。

[Game]
id = arknights

# 游戏主程序路径。启动游戏时使用，未填写则需在设置中指定。
# 模板留空，不要写入本机绝对路径。
exe =

# MOD 根目录。相对路径以软件根目录为基准。
mod_dir = game\arknights\mods

# MOD安装目录。相对路径以软件根目录为基准，兼容绝对路径。可在游戏设置中浏览选择该目录。
mod_target_dir = game\arknights\modern_dependency\M4A\mods

# 启动器。相对路径以软件根目录为基准。
launcher = game\arknights\modern_dependency\M4A\M4ALauncher.exe

# 当前选用的现代依赖文件夹名（位于 modern_dependency 下）。
modern_dependency = M4A

# 角色名册。相对路径以本游戏文件夹为基准。
characters = characters/characters.json

# 未填写时使用角色名册所在文件夹。
avatars = characters/heads

# 干员列表更新脚本。相对路径以本游戏文件夹为基准。
characters_update = characters/characters_update.py

# 角色文件导出的默认目录。相对路径以软件根目录为基准。
output_dir = game\arknights\output_files

# 角色列表右侧立绘预览：true=新模式，false=旧模式（仅列表）。
character_preview = true

# 压缩包需要密码时设为 True，走特殊解压流程。
# password = False

# 安装时弹出经典 / 现代 / 移动端类型选择。
install_ask_mod_type = true

# 完整 MOD 管理器。
tool_only = false
status = full
