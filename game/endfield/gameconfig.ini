# 明日方舟：终末地 游戏配置。选择本游戏后由软件读取。
# MOD 由第三方加载器读取：当前为 EFF（github.com/ssice-a/EFF），预留 XXMI（EFMI）。

[Game]
id = endfield

# 游戏主程序 Endfield.exe 的位置。模板留空，请在设置中选择，不要写入本机绝对路径。
exe =

# MOD 加载器：eff（当前支持）/ xxmi（预留，暂未支持）。
mod_loader = eff

# MOD 根目录（MODLAB 侧的 MOD 库）。相对路径以软件根目录为基准。
mod_dir = game\endfield\mods

# 加载器读取 MOD 的目录（固定为 <Endfield.exe 目录>\plugin\mods，本项保留兼容旧配置，界面不显示）。
mod_target_dir =

# XXMI（EFMI）的 Mods 目录，选用 xxmi 加载器时使用（预留）。
xxmi_mods_dir =

# 启动器：留空则直接运行 Endfield.exe；也可以填启动器路径。
launcher =

# 导出默认目录。
output_dir = game\endfield\output_files

# 游戏资源索引：AnimeStudio 工作区文件夹（含 index\endfield_assets.eidx），或 eidx 文件本身。
# 「更新干员列表」从这里读取游戏内的干员列表；留空则改用 AKEData 的解包数据。
asset_index =

# 干员名册（由「更新干员列表」生成），头像存放在 characters/heads。
characters = characters/characters.json
avatars = characters/heads
supports_characters = true
character_preview = false

# 预览只显示 MOD 里的 readme / 说明文件。
supports_preview = true

# 安装时不弹类型选择：终末地 MOD 一律按加载器 MOD 整夹复制。
install_ask_mod_type = false
install_default_mod_type = modern

tool_only = false
status = full
