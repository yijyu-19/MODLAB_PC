# 雀魂游戏配置。选择本游戏后由软件读取。
# 依赖：MajsoulMax（mitmproxy），位于 modern_dependency/MajsoulMax

[Game]
id = majsoul

# 游戏主程序路径（Steam / 客户端）。网页版可留空。模板不要写入本机绝对路径。
exe =

# MOD 根目录（软件侧已安装的替换资源包）。相对路径以软件根目录为基准。
mod_dir = game\majsoul\mods

# MOD 安装目录：启用后复制到 MajsoulMax 的 replace 目录（网页版资源替换）。
mod_target_dir = game\majsoul\modern_dependency\MajsoulMax\replace

# 启动器：启动 MajsoulMax 代理（mitmdump）。
launcher = game\majsoul\modern_dependency\MajsoulMaxLauncher.bat

# 当前选用的现代依赖文件夹名（位于 modern_dependency 下）。
modern_dependency = MajsoulMax

# 角色名册。相对路径以本游戏文件夹为基准。
# 角色名册。由 characters/characters_update.py 从 MajsoulData 表生成。
characters = characters/characters.json

# 未填写时使用角色名册所在文件夹。
avatars = characters/heads

# 角色/皮肤列表更新脚本。相对路径以本游戏文件夹为基准。
characters_update = characters/characters_update.py

# 导出默认目录。
output_dir = game\majsoul\output_files

# 角色列表右侧立绘预览：true=新模式（右 1/3 预览），false=旧模式（仅列表）。
character_preview = true

# 游戏版本：web（网页版，默认）或 steam（客户端 / Steam）。
game_edition = web

# 无 modconfig 时不弹类型选择，直接按现代 MOD 安装。
install_ask_mod_type = false
install_default_mod_type = modern

tool_only = false
status = full
