[item:20261116-update-4.6.0]
category = update
level = update
priority = 90
title = 实验室PC版 4.6.0 发布
link = https://github.com/yijyu-19/MODLAB_PC/releases/latest
body = 实验室PC版4.6.0已发布。
    本次更新主要内容如下：
    
    1.为明日方舟游戏增加了用户自助修复MOD的功能。
    2.修复了一个BUG，该BUG曾导致无法正确安装MOD。
    3.修复了一个BUG，该BUG曾导致可能的MUMU模拟器闪退。
    


    已知问题：
    1.碧蓝航线角色导出功能未做完。
    2.明日方舟M4A的游戏内菜单未完全做完。

    感谢各位对MODLAB的支持。

