[item：20261022-warning-1]
        category = warning
        level = warning
        priority = 999
        title= 关于10.21晚事件导致的软件安全性问题
        force_ack = true
        body = 由于2026.10.21晚的全球性CA证书失信问题使得4.4.1及以下的所有版本可能命中此安全漏洞。
        4.4.2版本删除了受影响的证书，目前低于4.4.2版本的软件均有此CA证书隐患。
        请在2027年前及时更新。逾期将因为安全性无法使用旧版软件。
