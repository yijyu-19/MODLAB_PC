[item:20260930-update-4.5.0]
category = update
level = update
priority = 90
title = 实验室PC版 4.5.0 发布
link = https://github.com/yijyu-19/MODLAB_PC/releases/latest
body = 实验室PC版4.5.0已发布。
    本次更新主要内容如下：
    
    MODLAB部分：
    1.支持了modwu格式的安装。此格式可以自动下载配置以实现过期MOD的自动判断。目前暂时仅用于碧蓝航线，但获取判断哈希等参数需要登录MODWU联网下载。
    2.支持了明日方舟：终末地的EFF模块。XXMI模块暂未适配，敬请期待。
    3.增加了部分游戏配置的自动修正功能。
    4.增加了打开MOD文件所在位置功能。
    5.增加了MOD列表内搜索功能。
    6.调整了“现代MOD精细管理”的逻辑：现在只会以整个子MOD文件夹来管理。
    7.调整了导出文件功能的相关逻辑。
    8.调整了部分UI的位置与样式。
    9.临时下架了不成熟导致有BUG可能导致卡死的欲都孤儿、PCL的相关功能。
    10.修复了一个BUG，该BUG曾导致点击启动游戏时软件卡死。
    11.修复了一个BUG，该BUG曾导致转换明日方舟MOD时找不到移动端文件。
    12.修复了一个BUG，该BUG曾导致转换明日方舟MOD时MOD种类出错。
    13.修复了一个BUG，该BUG曾导致无法安装部分依赖。
    14.修复了一个BUG，该BUG曾导致读取公告时有概率卡掉公告并卡死。
    15.修复了一个BUG，该BUG曾导致无法安装拥有压缩包密码的MOD。
    16.修复了一个BUG，该BUG曾导致转换MOD时没有正常读取配置文件。
    17.修复了一个BUG，该BUG曾导致UI可能错。。
    18.修复了一个BUG，该BUG曾导致MOD类型标记错误。
    19.修复了部分语言用词的错误与缺失。

    M4A部分：

    M4A 2.0.0版本已发布。
    1.新增了Lua语言参数系统，以适配基于明日方舟游戏内操作的高自由度MOD。
    2.新增了游戏内菜单，可用于控制含Lua模块的MOD。默认按F8打开。
    3.Lua语言适配新增了基于角色使用技能和战斗结算情况的参数扳机。
    4.大幅优化了软件性能，减少卡顿与卡死的情况出现。
    5.修复了一个BUG，该BUG曾导致Alpha类的现代MOD组件加载失败。
    6.修复了一个BUG，该BUG曾导致经典MOD安装错误。
    7.修复了一个BUG，该BUG曾导致F10刷新功能临时失效。
    8.修复了一个BUG，该BUG曾导致潜在的硬盘错误读写风险。
    9.修复了一个BUG，该BUG曾导致加载MOD瞬间卡死。
    10.修复了一个BUG，该BUG曾导致缓存未正确写入与清理。
    11.修复了一个BUG，该BUG曾导致IL2CPP类未生效导致的部分功能失效。

    已知问题：
    1.碧蓝航线角色导出功能未完。
    2.明日方舟M4A的游戏内菜单未完全做完。
    3.部分新增功能偶发性无法正常使用
    4.部分联网功能缺失。
    5.雀魂的relplace功能逻辑更改后暂未做对应的适配。


    感谢各位对MODLAB的支持。

